[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-rl"
version = "0.1.0"
description = "Runnable reinforcement learning course labs"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.5"]

[project.scripts]
RL = "learning_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
